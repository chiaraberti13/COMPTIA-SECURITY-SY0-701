# Grype configuration for the container image scan (security.yml).
#
# Narrow, justified exceptions only: a CVE is listed here when it is present in
# the image but cannot affect the running app, with the reason and the way it
# goes away. Review this file whenever the base image digest changes.
ignore:
  # libssl3 3.0.20 in gcr.io/distroless/cc-debian12 (fixed in 3.0.22-1~deb12u1,
  # not yet rebuilt by distroless on 2026-09-26). Not reachable: the only
  # process in the image is the Node.js binary, which bundles its own OpenSSL
  # (3.5.8) and does not link or load the system libssl/libcrypto. The CI job
  # "Container image" asserts this on every run. Remove these entries when
  # Dependabot brings a distroless digest with libssl3 >= 3.0.22.
  - vulnerability: CVE-2026-75803
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-63076
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-54874
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-63072
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-63074
    package: { name: libssl3, type: deb }
  - vulnerability: CVE-2026-42767
    package: { name: libssl3, type: deb }
