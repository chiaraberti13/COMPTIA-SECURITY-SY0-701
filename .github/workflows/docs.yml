name: Docs

# Style and links of the Markdown documentation (README, CONTRIBUTING, roadmap,
# changelog, docs/ and .github/). Actions are pinned to commit SHAs like in
# ci.yml; tests/workflows.test.ts enforces it.
#
# Links are checked in two ways with lychee (lychee.toml):
# - internal links (files and #anchors of this repository) on every change,
#   offline: the result depends only on the commit, so a failure is always real;
# - external links once a week and on demand: a remote site can break without
#   any commit here, and a failure must not block unrelated pull requests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC (an off-peak minute avoids the top-of-hour queue).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint and internal links
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rules in .markdownlint-cli2.jsonc.
      - name: Markdown lint
        run: npm run lint:md

      - name: Internal links and anchors (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --offline --no-progress
            './*.md' './docs/**/*.md' './.github/**/*.md'
          jobSummary: true

  external-links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The job token only raises the GitHub rate limit for github.com links.
      - name: External links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            './*.md' './docs/**/*.md' './.github/**/*.md'
          jobSummary: true
