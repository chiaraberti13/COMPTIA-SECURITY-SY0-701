name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev): an independent, repeatable score of
# the repository's security practices (pinned dependencies, token permissions,
# branch protection, code review, dangerous workflow patterns, ...). Results go
# to the Security tab as code-scanning alerts and to the public Scorecard API,
# which serves the badge in the README.
#
# With publish_results the workflow must follow Scorecard's rules: read-only
# permissions at the top level, only allow-listed actions, no other steps.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload of the results to the Security tab.
      security-events: write
      # Signs the published results (OIDC), so the API can verify their origin.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
