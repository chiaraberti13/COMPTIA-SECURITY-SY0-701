name: CI

# Every third-party action is pinned to a full commit SHA, because a tag such as
# "v4" can be moved to different code at any time. The trailing comment records
# the release the SHA belongs to. Dependabot (.github/dependabot.yml) proposes
# updates as pull requests that change SHA and comment together; review the
# action's release notes before merging. tests/workflows.test.ts enforces this.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the Active LTS and the version pinned in .nvmrc; 22 is the
        # oldest release line still allowed by "engines" in package.json.
        # Drop 22 from the matrix when it reaches end of life (April 2027).
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes: do not leave the job token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # All unit, API and component tests, with the coverage thresholds of
      # vitest.config.ts on the pure logic and the server.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Starts dist/server.cjs with NODE_ENV=production: catches errors that only
      # appear at start-up (route patterns, missing files, security headers),
      # which typecheck, unit tests and the build cannot see.
      - name: Smoke test (production start-up)
        run: npm run smoke

  e2e:
    name: End-to-end (Playwright, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Chromium matching the pinned @playwright/test version, with system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Layout at phone and desktop width, WCAG 2.2 AA with axe, quiz by keyboard.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container:
    name: Container image (build, hardened run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag comptia-sy0701:ci .

      # The same flags the README recommends: read-only root filesystem, no
      # Linux capabilities, no privilege escalation. The app must work with
      # all of them, and must not run as root.
      - name: Run it hardened and probe it
        run: |
          docker run --detach --name app --publish 3000:3000 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --env AI_DAILY_LIMIT=0 comptia-sy0701:ci
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:3000/healthz && break; sleep 1; done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = 200
          curl --silent --head http://127.0.0.1:3000/ | grep --ignore-case "content-security-policy: default-src 'self'"
          test "$(docker inspect app --format '{{.Config.User}}')" = nonroot
          docker exec app /nodejs/bin/node -e 'process.exit(process.getuid() === 0 ? 1 : 0)'
          # .grype.yaml ignores system libssl3 CVEs because Node does not load
          # that library (it bundles its own OpenSSL). Keep that claim true.
          docker exec app /nodejs/bin/node -e 'const maps = require("fs").readFileSync("/proc/self/maps", "utf8"); process.exit(/libssl|libcrypto/.test(maps) ? 1 : 0)'

      - name: Stops cleanly on SIGTERM
        run: |
          docker stop --time 10 app
          test "$(docker inspect app --format '{{.State.ExitCode}}')" = 0

      - name: Container logs
        if: always()
        run: docker logs app || true
